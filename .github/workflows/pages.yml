name: Publish GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a deployment finish before starting the next one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    # Manual runs must also use the publication branch.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false

      # This project uses Node's built-in test runner and has no dependencies.
      - name: Run tests
        run: npm test

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6.0.0

      - name: Upload website files
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v5.0.1
